name: Build Wild Frontier Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out game project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot-bin
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          mkdir templates
          unzip -q templates.tpz -d templates
          cp -r templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/WildFrontier.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0"
          package/unique_name="com.example.wildfrontier"
          package/name="Wild Frontier"
          package/signed=false
          screen/immersive_mode=true
          screen/support_small=true
          screen/support_normal=true
          screen/support_large=true
          screen/support_xlarge=true
          EOF

      - name: Import project
        run: |
          GODOT=$(find godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)
          chmod +x "$GODOT"
          "$GODOT" --headless --editor --path . --quit

      - name: Export APK
        run: |
          mkdir -p build
          GODOT=$(find godot-bin -maxdepth 1 -type f -name 'Godot*' | head -n 1)
          "$GODOT" --headless --path . --export-debug "Android" build/WildFrontier.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wild-Frontier-APK
          path: build/WildFrontier.apk
          if-no-files-found: error
